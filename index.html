<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลาบจกข้าวเหนียว by 12aFaEl</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 5px;
            color: #ff9800;
        }
        p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        .notif-bar {
            text-align: center;
            margin-bottom: 15px;
        }
        .btn-notif {
            background-color: #00bcd4;
            color: #000;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn-notif.active {
            background-color: #4caf50;
            color: #fff;
        }

        /* ส่วนแสดง 20 ข้าวเหนียวใกล้สุก (แบบควบคุมได้จากด้านบน) */
        .top20-container {
            background-color: #1a1a1a;
            border: 2px solid #ff9800;
            border-radius: 10px;
            padding: 15px;
            max-width: 1450px;
            margin: 0 auto 25px auto;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.2);
        }
        .top20-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top20-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .top20-item {
            background-color: #262626;
            padding: 12px;
            border-radius: 8px;
            border-left: 5px solid #00bcd4;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .top20-item.urgent {
            border-left-color: #f44336;
            background-color: #331818;
            animation: blink 1s infinite;
        }
        .top20-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top20-name-display {
            font-weight: bold;
            font-size: 0.95rem;
            color: #ff9800;
        }
        .top20-timer {
            font-size: 1.3rem;
            font-weight: bold;
            font-family: monospace;
            color: #fff;
        }
        .top20-control {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .top20-input {
            width: 100%;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: white;
            font-size: 0.8rem;
            text-align: center;
        }
        .top20-btn {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-top-start { background-color: #ff9800; color: #000; }
        .btn-top-reset { background-color: #555; color: #fff; }
        .empty-top20 {
            color: #666;
            font-size: 0.9rem;
            font-style: italic;
            grid-column: 1 / -1;
            text-align: center;
            padding: 15px;
        }

        /* การ์ดปกติ 50 จุดด้านล่าง */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 12px;
            max-width: 1450px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 12px;
            border: 2px solid #333;
            transition: all 0.3s ease;
        }
        .card.normal { border-color: #4caf50; }
        .card.warning { border-color: #ff9800; background-color: #2a2115; }
        .card.danger { border-color: #f44336; background-color: #2c1515; animation: blink 1s infinite; }
        
        @keyframes blink {
            50% { border-color: transparent; }
        }

        .card-header {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .name-input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed #666;
            color: #ff9800;
            font-weight: bold;
            font-size: 0.95rem;
            width: 120px;
        }
        .name-input:focus {
            outline: none;
            border-bottom-color: #ff9800;
        }
        .target-time {
            font-size: 0.8rem;
            color: #00bcd4;
            background: rgba(0, 188, 212, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .timer-display {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin: 4px 0;
            font-family: monospace;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 6px;
        }
        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            font-size: 0.8rem;
            color: #aaa;
        }
        input[type="text"] {
            width: 100%;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 0.85rem;
            text-align: center;
        }
        .quick-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            margin-bottom: 6px;
        }
        .btn-quick {
            background-color: #333;
            color: #aaa;
            padding: 4px;
            font-size: 0.75rem;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-quick:hover { background-color: #444; color: #fff; }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        button {
            padding: 6px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-start { background-color: #ff9800; color: #000; }
        .btn-reset { background-color: #555; color: #fff; }
    </style>
</head>
<body>

    <h1>🌾 ลาบจกข้าวเหนียว by 12aFaEl</h1>
    <p class="subtitle">กรอกเวลานึ่ง หรือกดปุ่มด่วนด้านบนเพื่อจัดการคิวเร่งด่วน 20 ช่อง</p>
    
    <div class="notif-bar">
        <button class="btn-notif" id="notifBtn" onclick="requestNotificationPermission()">🔔 เปิดการแจ้งเตือน (Windows / มือถือ)</button>
    </div>

    <!-- แถบ 20 ข้าวเหนียวใกล้สุก (เพิ่มช่องกรอกเวลาสั่งการจากด้านบนได้ทันที) -->
    <div class="top20-container">
        <div class="top20-title">🔥 20ข้าวเหนียวใกล้สุก (สามารถกรอกเวลาสั่งเริ่ม/รีเซ็ตจากตรงนี้ได้ทันที)</div>
        <div class="top20-grid" id="top20Grid">
            <span class="empty-top20">ยังไม่มีจุดที่กำลังนับถอยหลัง... (สามารถกดเลือกจุดด้านล่าง หรือกรอกเวลาเริ่มที่การ์ดได้เลย)</span>
        </div>
    </div>

    <div class="grid-container" id="timerContainer"></div>

    <script>
        const TOTAL_PUMP = 50;
        const timers = [];
        const container = document.getElementById('timerContainer');
        const top20Grid = document.getElementById('top20Grid');
        
        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.log("Audio Context Error:", e);
            }
        }

        function checkPermissionState() {
            const btn = document.getElementById('notifBtn');
            if ("Notification" in window) {
                if (Notification.permission === "granted") {
                    btn.innerText = "✅ เปิดการแจ้งเตือนเรียบร้อยแล้ว";
                    btn.classList.add('active');
                } else if (Notification.permission === "denied") {
                    btn.innerText = "❌ การแจ้งเตือนถูกบล็อก (ต้องปลดล็อกที่ตั้งค่าเบราว์เซอร์)";
                    btn.style.backgroundColor = "#f44336";
                    btn.style.color = "#fff";
                }
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    checkPermissionState();
                    if (permission === "granted") {
                        alert("เปิดการแจ้งเตือนสำเร็จ!");
                        new Notification("🌾 ลาบจกข้าวเหนียว", { body: "ระบบแจ้งเตือนพร้อมใช้งานแล้ว!" });
                    }
                });
            }
        }

        function sendDesktopNotification(title, body) {
            playBeepSound();
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    new Notification(title, {
                        body: body,
                        icon: "https://cdn-icons-png.flaticon.com/512/3602/3602145.png",
                        requireInteraction: true
                    });
                } catch (err) {}
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkPermissionState();
        });

        // สร้างการ์ด 50 จุดหลัก
        for (let i = 1; i <= TOTAL_PUMP; i++) {
            timers.push({
                id: i,
                targetTime: null,
                interval: null,
                notifiedAlert: false
            });

            const savedName = localStorage.getItem(`sticky_rice_name_${i}`) || `จุดที่ ${i}`;
            const savedNotifTime = localStorage.getItem(`sticky_rice_notif_${i}`) || "3";

            const cardHtml = `
                <div class="card" id="card-${i}">
                    <div class="card-header">
                        <span>📍 <input type="text" class="name-input" id="name-${i}" value="${savedName}" onchange="saveName(${i}, this.value)"></span>
                        <span class="target-time" id="target-${i}">สุก: --:--</span>
                    </div>
                    <div class="timer-display" id="display-${i}">--:--</div>
                    <div class="input-group">
                        <div class="input-row">
                            <span>เวลานึ่ง:</span>
                            <input type="text" id="input-${i}" placeholder="เช่น 30 หรือ 13:10">
                        </div>
                        <div class="input-row">
                            <span>เตือนล่วงหน้า:</span>
                            <input type="text" id="notif-input-${i}" value="${savedNotifTime}" placeholder="เช่น 3" onchange="saveNotifTime(${i}, this.value)">
                        </div>
                    </div>
                    <div class="quick-btn-group">
                        <button class="btn-quick" onclick="quickSet(${i}, 30)">+30 นาที</button>
                        <button class="btn-quick" onclick="quickSet(${i}, 35)">+35 นาที</button>
                        <button class="btn-quick" onclick="quickSet(${i}, 40)">+40 นาที</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn-start" onclick="setTimer(${i})">เริ่มจับเวลา</button>
                        <button class="btn-reset" onclick="clearTimer(${i})">รีเซ็ต</button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        }

        function saveName(id, val) {
            localStorage.setItem(`sticky_rice_name_${id}`, val);
            updateTop20Display();
        }

        function saveNotifTime(id, val) {
            localStorage.setItem(`sticky_rice_notif_${id}`, val);
        }

        function quickSet(id, mins) {
            document.getElementById(`input-${id}`).value = mins;
            setTimer(id);
        }

        function parseInputToSeconds(inputStr) {
            if (!inputStr) return 0;
            inputStr = String(inputStr).trim();
            const parts = inputStr.split(/[:.\s]+/);
            if (parts.length >= 2) {
                const mins = parseInt(parts[0]) || 0;
                const secs = parseInt(parts[1]) || 0;
                return (mins * 60) + secs;
            } else {
                const mins = parseInt(parts[0]) || 0;
                return mins * 60;
            }
        }

        function setTimer(id) {
            const inputVal = document.getElementById(`input-${id}`).value;
            const totalSecondsInput = parseInputToSeconds(inputVal);
            
            if (totalSecondsInput <= 0) {
                alert('กรุณากรอกเวลาให้ถูกต้อง เช่น 30 หรือ 13:10');
                return;
            }

            const timer = timers.find(t => t.id === id);
            if (timer.interval) clearInterval(timer.interval);

            const now = Date.now();
            timer.targetTime = now + (totalSecondsInput * 1000);
            timer.notifiedAlert = false;

            updateTimer(id);

            timer.interval = setInterval(() => {
                const finished = updateTimer(id);
                if (finished) {
                    clearInterval(timer.interval);
                    timer.interval = null;
                }
            }, 1000);
        }

        // ฟังก์ชันสั่งตั้งเวลาผ่านกรอบด้านบนโดยตรง
        function setTimerFromTop(id) {
            const inputVal = document.getElementById(`top-input-${id}`).value;
            const totalSecondsInput = parseInputToSeconds(inputVal);
            
            if (totalSecondsInput <= 0) {
                alert('กรุณากรอกเวลาให้ถูกต้อง เช่น 30 หรือ 13:10');
                return;
            }
            // ซิงค์ค่าไปช่องล่างด้วย
            document.getElementById(`input-${id}`).value = inputVal;
            setTimer(id);
        }

        function updateTimer(id) {
            const timer = timers.find(t => t.id === id);
            const display = document.getElementById(`display-${id}`);
            const targetDisplay = document.getElementById(`target-${id}`);
            const card = document.getElementById(`card-${id}`);
            const locationName = document.getElementById(`name-${id}`).value || `จุดที่ ${id}`;
            const notifInputVal = document.getElementById(`notif-input-${id}`).value;

            const alertThresholdSec = parseInputToSeconds(notifInputVal) || 180;

            const now = Date.now();
            const remainingMs = timer.targetTime - now;
            const remainingSeconds = Math.max(0, Math.floor(remainingMs / 1000));

            const targetDate = new Date(timer.targetTime);
            const targetHours = String(targetDate.getHours()).padStart(2, '0');
            const targetMins = String(targetDate.getMinutes()).padStart(2, '0');
            targetDisplay.innerText = `สุก: ${targetHours}:${targetMins}`;

            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;

            display.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            if (remainingSeconds <= alertThresholdSec && remainingSeconds > 0 && !timer.notifiedAlert) {
                timer.notifiedAlert = true;
                const remainMinsText = mins > 0 ? `${mins} นาที` : `${secs} วินาที`;
                sendDesktopNotification("⚠️ ข้าวเหนียวใกล้สุกแล้ว!", `📍 [${locationName}] จะสุกในอีก ${remainMinsText} นี้!`);
            }

            card.className = 'card';
            let finished = false;
            if (remainingSeconds <= 0) {
                card.classList.add('danger');
                display.innerText = "จกได้เลย!";
                targetDisplay.innerText = "ถึงเวลาแล้ว!";
                finished = true;
            } else if (remainingSeconds <= alertThresholdSec) {
                card.classList.add('warning');
            } else {
                card.classList.add('normal');
            }

            updateTop20Display();
            return finished;
        }

        // อัปเดตการแสดงผล 20 อันดับด้านบน พร้อมช่องกรอกเวลาในตัว
        function updateTop20Display() {
            const now = Date.now();
            
            const activeTimers = timers.filter(t => t.targetTime !== null).map(t => {
                const remainingSec = Math.max(0, Math.floor((t.targetTime - now) / 1000));
                const name = document.getElementById(`name-${t.id}`).value || `จุดที่ ${t.id}`;
                const targetDate = new Date(t.targetTime);
                const targetHours = String(targetDate.getHours()).padStart(2, '0');
                const targetMins = String(targetDate.getMinutes()).padStart(2, '0');

                return {
                    id: t.id,
                    name: name,
                    remainingSec: remainingSec,
                    targetTimeStr: `${targetHours}:${targetMins}`
                };
            });

            activeTimers.sort((a, b) => a.remainingSec - b.remainingSec);
            const top20 = activeTimers.slice(0, 20);

            if (top20.length === 0) {
                top20Grid.innerHTML = `<span class="empty-top20">ยังไม่มีจุดที่กำลังนับถอยหลัง... (สามารถกดเริ่มจับเวลาจากช่องด้านล่าง หรือกรอกที่การ์ดได้เลย)</span>`;
                return;
            }

            let html = '';
            top20.forEach((item, index) => {
                const mins = Math.floor(item.remainingSec / 60);
                const secs = item.remainingSec % 60;
                const timeStr = item.remainingSec <= 0 ? "จกได้เลย!" : `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                const isUrgent = item.remainingSec <= 180 ? 'urgent' : '';

                html += `
                    <div class="top20-item ${isUrgent}">
                        <div class="top20-header">
                            <span class="top20-name-display">#${index + 1} 📍 ${item.name} (${item.targetTimeStr})</span>
                            <span class="top20-timer">${timeStr}</span>
                        </div>
                        <div class="top20-control">
                            <input type="text" class="top20-input" id="top-input-${item.id}" placeholder="แก้เวลา เช่น 30">
                            <button class="top20-btn btn-top-start" onclick="setTimerFromTop(${item.id})">ตั้งเวลา</button>
                            <button class="top20-btn btn-top-reset" onclick="clearTimer(${item.id})">รีเซ็ต</button>
                        </div>
                    </div>
                `;
            });

            top20Grid.innerHTML = html;
        }

        function clearTimer(id) {
            const timer = timers.find(t => t.id === id);
            if (timer.interval) clearInterval(timer.interval);
            timer.targetTime = null;
            timer.notifiedAlert = false;
            document.getElementById(`input-${id}`).value = '';
            
            const card = document.getElementById(`card-${id}`);
            card.className = 'card';
            document.getElementById(`display-${id}`).innerText = '--:--';
            document.getElementById(`target-${id}`).innerText = 'สุก: --:--';

            updateTop20Display();
        }
    </script>
</body>
</html>
