<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Cement Timer by 12aFaEl</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 5px;
            color: #ff9800;
        }
        p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        .notif-bar {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-notif {
            background-color: #00bcd4;
            color: #000;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 12px;
            border: 2px solid #333;
            transition: all 0.3s ease;
        }
        .card.normal { border-color: #4caf50; }
        .card.warning { border-color: #ff9800; background-color: #2a2115; }
        .card.danger { border-color: #f44336; background-color: #2c1515; animation: blink 1s infinite; }
        
        @keyframes blink {
            50% { border-color: transparent; }
        }

        .card-header {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .name-input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed #666;
            color: #ff9800;
            font-weight: bold;
            font-size: 0.95rem;
            width: 110px;
        }
        .name-input:focus {
            outline: none;
            border-bottom-color: #ff9800;
        }
        .target-time {
            font-size: 0.8rem;
            color: #00bcd4;
            background: rgba(0, 188, 212, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .timer-display {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin: 4px 0;
            font-family: monospace;
        }
        .input-group {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
        }
        input[type="number"] {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 0.9rem;
            text-align: center;
        }
        .quick-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 6px;
        }
        .btn-quick {
            background-color: #333;
            color: #aaa;
            padding: 4px;
            font-size: 0.75rem;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-quick:hover { background-color: #444; color: #fff; }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        button {
            padding: 6px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-start { background-color: #ff9800; color: #000; }
        .btn-reset { background-color: #555; color: #fff; }
    </style>
</head>
<body>

    <h1>🧱 ระบบจับเวลากองปูน FiveM by 12aFaEl</h1>
    <p class="subtitle">คลิกที่ชื่อเพื่อแก้ไขชื่อจุดปูนได้ตามต้องการ (ระบบจะเซฟชื่อให้อัตโนมัติ)</p>
    
    <div class="notif-bar">
        <button class="btn-notif" onclick="requestNotificationPermission()">🔔 กดเปิดการแจ้งเตือนบนหน้าจอคอม (Windows Notification)</button>
    </div>

    <div class="grid-container" id="timerContainer"></div>

    <script>
        const TOTAL_PUMP = 50;
        const timers = [];

        const container = document.getElementById('timerContainer');
        
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("เปิดการแจ้งเตือนสำเร็จ! ระบบจะเด้งเตือนขวาบนจอเมื่อเหลือ 3 นาทีครับ");
                    } else {
                        alert("การแจ้งเตือนถูกปฏิเสธ โปรดเปิดอนุญาตในตั้งค่าเบราว์เซอร์");
                    }
                });
            } else {
                alert("เบราว์เซอร์นี้ไม่รองรับระบบแจ้งเตือน");
            }
        }

        function sendDesktopNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: body,
                    icon: "https://cdn-icons-png.flaticon.com/512/3602/3602145.png"
                });
            }
        }

        // สร้างการ์ด 50 กอง + ดึงชื่อที่เคยบันทึกไว้ในเครื่องขึ้นมา
        for (let i = 1; i <= TOTAL_PUMP; i++) {
            timers.push({
                id: i,
                targetTime: null,
                interval: null,
                notified3Min: false
            });

            // ดึงชื่อเก่าจาก localStorage ถ้าไม่มีให้ใช้คำว่า "กองที่ i"
            const savedName = localStorage.getItem(`cement_name_${i}`) || `กองที่ ${i}`;

            const cardHtml = `
                <div class="card" id="card-${i}">
                    <div class="card-header">
                        <span>📍 <input type="text" class="name-input" id="name-${i}" value="${savedName}" onchange="saveName(${i}, this.value)"></span>
                        <span class="target-time" id="target-${i}">เก็บ: --:--</span>
                    </div>
                    <div class="timer-display" id="display-${i}">--:--</div>
                    <div class="input-group">
                        <input type="number" id="input-${i}" placeholder="นาที" min="1">
                    </div>
                    <div class="quick-btn-group">
                        <button class="btn-quick" onclick="quickSet(${i}, 30)">+30 นาที</button>
                        <button class="btn-quick" onclick="quickSet(${i}, 35)">+35 นาที</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn-start" onclick="setTimer(${i})">เริ่มจับเวลา</button>
                        <button class="btn-reset" onclick="clearTimer(${i})">รีเซ็ต</button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        }

        // ฟังก์ชันบันทึกชื่อลงในเบราว์เซอร์
        function saveName(id, val) {
            localStorage.setItem(`cement_name_${id}`, val);
        }

        function quickSet(id, mins) {
            document.getElementById(`input-${id}`).value = mins;
            setTimer(id);
        }

        function setTimer(id) {
            const input = document.getElementById(`input-${id}`);
            const minutes = parseInt(input.value);
            
            if (isNaN(minutes) || minutes <= 0) {
                alert('กรุณากรอกจำนวนนาทีให้ถูกต้องครับ');
                return;
            }

            const timer = timers.find(t => t.id === id);
            if (timer.interval) clearInterval(timer.interval);

            const now = Date.now();
            timer.targetTime = now + (minutes * 60 * 1000);
            timer.notified3Min = false;

            updateTimer(id);

            timer.interval = setInterval(() => {
                const finished = updateTimer(id);
                if (finished) {
                    clearInterval(timer.interval);
                    timer.interval = null;
                }
            }, 1000);
        }

        function updateTimer(id) {
            const timer = timers.find(t => t.id === id);
            const display = document.getElementById(`display-${id}`);
            const targetDisplay = document.getElementById(`target-${id}`);
            const card = document.getElementById(`card-${id}`);
            const locationName = document.getElementById(`name-${id}`).value || `กองที่ ${id}`;

            const now = Date.now();
            const remainingMs = timer.targetTime - now;
            const remainingSeconds = Math.max(0, Math.floor(remainingMs / 1000));

            const targetDate = new Date(timer.targetTime);
            const targetHours = String(targetDate.getHours()).padStart(2, '0');
            const targetMins = String(targetDate.getMinutes()).padStart(2, '0');
            targetDisplay.innerText = `เก็บ: ${targetHours}:${targetMins}`;

            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;

            display.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            if (remainingSeconds <= 180 && remainingSeconds > 0 && !timer.notified3Min) {
                timer.notified3Min = true;
                sendDesktopNotification("⚠️ กองปูนใกล้พร้อมแล้ว!", `📍 ${locationName} เหลือเวลาอีก 3 นาทีจะจกได้!`);
            }

            card.className = 'card';
            if (remainingSeconds <= 0) {
                card.classList.add('danger');
                display.innerText = "ไปเก็บโลด!";
                targetDisplay.innerText = "ถึงเวลาแล้ว!";
                return true;
            } else if (remainingSeconds <= 180) {
                card.classList.add('warning');
            } else {
                card.classList.add('normal');
            }
            return false;
        }

        function clearTimer(id) {
            const timer = timers.find(t => t.id === id);
            if (timer.interval) clearInterval(timer.interval);
            timer.targetTime = null;
            timer.notified3Min = false;
            document.getElementById(`input-${id}`).value = '';
            
            const card = document.getElementById(`card-${id}`);
            card.className = 'card';
            document.getElementById(`display-${id}`).innerText = '--:--';
            document.getElementById(`target-${id}`).innerText = 'เก็บ: --:--';
        }
    </script>
</body>
</html>
